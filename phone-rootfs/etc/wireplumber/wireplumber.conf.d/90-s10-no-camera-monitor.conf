# S10 power: the session manager must not keep the camera media/V4L2 nodes open.
# While they are open the camera pipeline stays powered: screen-off current ~330 -> ~210 mA
# (docs/NOTE-idle-power-ufs-20261027.md). Cameras stay usable for apps that open V4L2/libcamera
# directly; only PipeWire camera nodes (portal) disappear.
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
    monitor.v4l2 = disabled
  }
}
