[[review]]
paths = ["kernel/overlay/drivers/soc/samsung/exynos9820-sleep-seq.h"]
reason = "Record the exact open-source input, revision, license and generation command for imported register tables."

[[review]]
paths = ["userspace/vowifi/swu_emulator.py"]
reason = "Verify exact upstream revision, retained GPLv3 text and the reproducible local integration patch; no GPLv2 relicensing."

[[review]]
paths = ["dts/*.dts"]
reason = "Device trees were decompiled during bring-up; establish the original source/license chain and replace installation-specific identifiers."



[[review]]
paths = ["phone-rootfs/etc/geoclue/geoclue.conf", "phone-rootfs/etc/modprobe.d/blacklist.conf"]
reason = "Generic distribution configuration copied during bring-up; establish its actual source/license rather than applying the project integration grant."


[[license_requirement]]
paths = ["userspace/vowifi/usim_cp.py"]
expressions = ["GPL-2.0-or-later"]
reason = "The original SIM adapter has an explicitly confirmed GPL-2.0-or-later grant so it can be shared by the GPLv2 IMS client and GPLv3 SWu process. Preserve this component-specific choice."

[[source_dependency]]
owner = "userspace/modem/s10modemd.py"
requires = ["userspace/modem/rfsd.py", "userspace/modem/s10cp.py", "userspace/modem/ipc.py"]

[[source_dependency]]
owner = "drivers/s10-camera-v4l2/s5k-cis.c"
requires = ["drivers/s10-camera-v4l2/s5k-fw.h", "drivers/s10-camera-v4l2/s5k-fw-manifest.h"]

[[source_dependency]]
owner = "phone-rootfs/etc/systemd/system/s10-modem.service"
requires = ["userspace/modem/boot-link.sh"]

[[source_dependency]]
owner = "userspace/modem/boot-link.sh"
requires = ["userspace/modem/boot2.sh", "userspace/modem/run.sh", "userspace/modem/s10modemd.py", "userspace/modem/tty/s10-modem-tty.c", "userspace/modem/tty/Makefile"]

[[source_dependency]]
owner = "userspace/modem/boot2.sh"
requires = ["userspace/modem/run.sh", "userspace/modem/load-radio.py", "userspace/modem/boot/s10-cp-boot.c", "userspace/modem/boot/Makefile"]
